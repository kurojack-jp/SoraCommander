[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sora-commander"
version = "0.1.0"
description = "Let ChatGPT work on your Windows PC, with local approval windows. Developer preview."
requires-python = ">=3.13"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["pywin32>=306; platform_system == 'Windows'"]

[project.optional-dependencies]
mcp = ["mcp>=1,<2", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
