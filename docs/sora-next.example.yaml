# Copy to %USERPROFILE%\.config\tunnel-client\sora-next.yaml and edit the three marked values.
# This file holds a reference to the key file, never the key itself.
config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: REPLACE_WITH_YOUR_TUNNEL_ID
  # Use the absolute path to sora-next.key in your Windows profile. Use forward slashes.
  api_key: file:REPLACE_WITH_ABSOLUTE_KEY_PATH
health:
  listen_addr: 127.0.0.1:8080
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    # Replace with the full path to your checkout. Forward slashes are required.
    # Use a checkout path accepted by setup. Actual starts from non-ASCII paths are unverified.
    - command: "cmd.exe /d /c C:/SoraCommander/tools/mcp-broker-client.cmd"
